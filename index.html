<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VR 2ª ITE - Paesaggio Mediterraneo e Geografia Economica</title>
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script>
    // Componente per attivare un'azione guardando l'oggetto per 1.5s o cliccando
    AFRAME.registerComponent('gaze-action', {
      schema: {
        action: { type: 'string', default: '' },
        value: { type: 'string', default: '' }
      },
      init: function () {
        this.timer = null;
        const el = this.el;

        const trigger = () => {
          el.emit('activated', { action: this.data.action, value: this.data.value });
          if (window.AppVR) {
            window.AppVR.handleAction(this.data.action, this.data.value);
          }
        };

        el.addEventListener('mouseenter', () => {
          el.setAttribute('scale', '1.08 1.08 1.08');
          this.timer = setTimeout(trigger, 1500);
        });

        el.addEventListener('mouseleave', () => {
          el.setAttribute('scale', '1 1 1');
          if (this.timer) {
            clearTimeout(this.timer);
            this.timer = null;
          }
        });

        el.addEventListener('click', () => {
          if (this.timer) {
            clearTimeout(this.timer);
            this.timer = null;
          }
          trigger();
        });
      }
    });
  </script>
</head>
<body>
  <a-scene vr-mode-ui="enabled: true" renderer="antialias: true; colorManagement: true">
    <!-- Cielo e luce mediterranea -->
    <a-sky color="#87CEEB"></a-sky>
    <a-light type="ambient" intensity="0.75" color="#FFF8E7"></a-light>
    <a-light type="directional" position="-8 14 10" intensity="1.1" color="#FFE5B4"></a-light>

    <!-- Sole -->
    <a-sphere position="-28 22 -35" radius="3" color="#FFD54F" material="emissive: #FFC107; emissiveIntensity: 0.6"></a-sphere>

    <!-- Mare e Porto -->
    <a-plane position="0 -0.4 -22" rotation="-90 0 0" width="140" height="60" color="#1E88E5" material="roughness: 0.25; metalness: 0.15"></a-plane>
    <!-- Molo -->
    <a-box position="4 -0.15 -14" width="3.5" height="0.5" depth="14" color="#B0BEC5"></a-box>
    <a-box position="4 0.12 -14" width="3.6" height="0.08" depth="14.1" color="#ECEFF1"></a-box>
    <!-- Faro sul molo -->
    <a-cylinder position="4 1.8 -20.5" radius="0.6" height="3.6" color="#FFFFFF"></a-cylinder>
    <a-cylinder position="4 2.6 -20.5" radius="0.62" height="0.6" color="#D32F2F"></a-cylinder>
    <a-cylinder position="4 3.8 -20.5" radius="0.75" height="0.7" color="#263238"></a-cylinder>

    <!-- Nave mercantile / cargo stilizzata -->
    <a-entity position="-6 0 -17">
      <a-box position="0 0.35 0" width="2.4" height="0.7" depth="6.5" color="#37474F"></a-box>
      <a-box position="0 1.0 -2.2" width="1.8" height="0.8" depth="1.4" color="#FFFFFF"></a-box>
      <!-- Container -->
      <a-box position="-0.5 0.95 0.6" width="0.9" height="0.55" depth="1.8" color="#E65100"></a-box>
      <a-box position="0.5 0.95 0.6" width="0.9" height="0.55" depth="1.8" color="#0277BD"></a-box>
    </a-entity>

    <!-- Terrazza panoramica dello studente -->
    <a-cylinder position="0 -0.15 0" radius="5.5" height="0.3" color="#D7CCC8"></a-cylinder>
    <a-ring position="0 0.01 0" rotation="-90 0 0" radius-inner="5.1" radius-outer="5.45" color="#8D6E63"></a-ring>

    <!-- Colline verdi sullo sfondo -->
    <a-cone position="-18 2.2 -38" radius-bottom="16" height="6" color="#558B2F"></a-cone>
    <a-cone position="18 2.8 -40" radius-bottom="18" height="7.5" color="#689F38"></a-cone>
    <a-cone position="2 1.8 -44" radius-bottom="22" height="5" color="#7CB342"></a-cone>

    <!-- Alberi stilizzati sulle colline / terrazza -->
    <a-entity position="-4.2 0 -2.2">
      <a-cylinder position="0 0.6 0" radius="0.14" height="1.2" color="#5D4037"></a-cylinder>
      <a-sphere position="0 1.5 0" radius="0.85" color="#388E3C"></a-sphere>
    </a-entity>
    <a-entity position="4.3 0 -2.0">
      <a-cylinder position="0 0.6 0" radius="0.14" height="1.2" color="#5D4037"></a-cylinder>
      <a-sphere position="0 1.5 0" radius="0.85" color="#2E7D32"></a-sphere>
    </a-entity>

    <!-- Pannello Principale (Domanda e Feedback) -->
    <a-entity id="main-panel" position="0 2.5 -4.2">
      <a-plane width="5.8" height="2.3" color="#102A43" material="opacity: 0.94; transparent: true"></a-plane>
      <a-plane position="0 1.12 0.01" width="5.8" height="0.06" color="#4FC3F7"></a-plane>
      <a-text id="station-title" value="GEOGRAFIA ECONOMICA - 2 ITE" position="-2.65 0.82 0.05" color="#4FC3F7" width="5.3" font="roboto"></a-text>
      <a-text id="question-text" value="Osserva il paesaggio costiero e collinare.\nScegli una stazione o avvia il percorso." position="-2.65 0.15 0.05" color="#FFFFFF" width="5.3" font="roboto"></a-text>
      <a-text id="feedback-text" value="Fissa lo sguardo per 1.5s su un pulsante." position="-2.65 -0.75 0.05" color="#A5D6A7" width="5.3" font="roboto"></a-text>
    </a-entity>

    <!-- 3 Pulsanti Risposta (A, B, C) -->
    <a-entity id="options-group" position="0 1.05 -4.0">
      <!-- Opzione A -->
      <a-entity position="-1.85 0 0" gaze-action="action: answer; value: A">
        <a-box width="1.65" height="0.62" depth="0.15" color="#1E88E5"></a-box>
        <a-text id="opt-a-text" value="A) Avvia" align="center" position="0 0 0.1" color="#FFFFFF" width="3.8"></a-text>
      </a-entity>

      <!-- Opzione B -->
      <a-entity position="0 0 0" gaze-action="action: answer; value: B">
        <a-box width="1.65" height="0.62" depth="0.15" color="#00897B"></a-box>
        <a-text id="opt-b-text" value="B) Domanda 1" align="center" position="0 0 0.1" color="#FFFFFF" width="3.8"></a-text>
      </a-entity>

      <!-- Opzione C -->
      <a-entity position="1.85 0 0" gaze-action="action: answer; value: C">
        <a-box width="1.65" height="0.62" depth="0.15" color="#5E35B1"></a-box>
        <a-text id="opt-c-text" value="C) Domanda 2" align="center" position="0 0 0.1" color="#FFFFFF" width="3.8"></a-text>
      </a-entity>
    </a-entity>

    <!-- Pulsante Avanti / Ripeti -->
    <a-entity id="next-btn" position="0 0.35 -4.0" visible="false" gaze-action="action: next; value: ">
      <a-box width="2.2" height="0.48" depth="0.15" color="#FFB300"></a-box>
      <a-text id="next-btn-text" value="PROSSIMA TAPPA" align="center" position="0 0 0.1" color="#102A43" width="4.2"></a-text>
    </a-entity>

    <!-- Camera con puntatore centrale (Gaze Cursor) -->
    <a-camera position="0 1.6 0" look-controls wasd-controls>
      <a-cursor
        position="0 0 -1"
        geometry="primitive: ring; radiusInner: 0.018; radiusOuter: 0.03"
        material="color: #FFEB3B; shader: flat"
        raycaster="objects: [gaze-action]"
        animation__click="property: scale; startEvents: activated; from: 0.6 0.6 0.6; to: 1 1 1; dur: 250">
      </a-cursor>
    </a-camera>
  </a-scene>

  <script>
    (function () {
      const questions = [
        {
          title: 'TAPPA 1/3 - COLLINE E FILIERA PRODUTTIVA',
          q: 'Sulle colline si coltivano olive e uva.\nCosa aumenta il VALORE AGGIUNTO locale?',
          a: 'A) Esportare solo il raccolto grezzo',
          b: 'B) Trasformare e imbottigliare in loco',
          c: 'C) Ridurre i controlli di qualita',
          correct: 'B',
          ok: 'Corretto! La trasformazione locale crea valore e occupazione sul territorio.',
          ko: 'Quasi: vendere solo materia prima grezza lascia altrove gran parte del valore.'
        },
        {
          title: 'TAPPA 2/3 - IL PORTO E I TRASPORTI',
          q: 'Osserva la nave cargo nel porto.\nQual e un vantaggio del trasporto marittimo?',
          a: 'A) Costo unitario basso su grandi volumi',
          b: 'B) Velocita superiore all aereo',
          c: 'C) Arrivo diretto in ogni negozio interno',
          correct: 'A',
          ok: 'Esatto! Il trasporto marittimo e ideale per grandi volumi su lunghe distanze.',
          ko: 'Riprova: la nave e lenta, ma molto conveniente per grandi quantita di merci.'
        },
        {
          title: 'TAPPA 3/3 - COSTI E TURISMO COSTIERO',
          q: 'Una struttura turistica sulla costa ha\nalti COSTI FISSI (mutuo, manutenzione). Come\nriduce il rischio di stagionalita?',
          a: 'A) Chiudendo da ottobre a maggio',
          b: 'B) Alzando i prezzi solo ad agosto',
          c: 'C) Promuovendo turismo enogastronomico\ne destagionalizzato',
          correct: 'C',
          ok: 'Ottimo! Destagionalizzare distribuisce i ricavi e copre meglio i costi fissi.',
          ko: 'Attenzione: i costi fissi restano anche quando la struttura e chiusa o vuota.'
        }
      ];

      let index = 0;
      let score = 0;
      let started = false;
      let answered = false;

      function renderQuestion() {
        answered = false;
        const item = questions[index];
        document.getElementById('station-title').setAttribute('value', item.title);
        document.getElementById('question-text').setAttribute('value', item.q);
        document.getElementById('opt-a-text').setAttribute('value', item.a);
        document.getElementById('opt-b-text').setAttribute('value', item.b);
        document.getElementById('opt-c-text').setAttribute('value', item.c);
        document.getElementById('feedback-text').setAttribute('value', 'Fissa A, B o C per 1.5s per rispondere.');
        document.getElementById('feedback-text').setAttribute('color', '#E0F7FA');
        document.getElementById('options-group').setAttribute('visible', 'true');
        document.getElementById('next-btn').setAttribute('visible', 'false');
      }

      function renderSummary() {
        document.getElementById('station-title').setAttribute('value', 'PERCORSO COMPLETATO');
        document.getElementById('question-text').setAttribute(
          'value',
          'Hai completato il paesaggio mediterraneo!\nPunteggio finale: ' + score + ' su ' + questions.length + ' risposte corrette.'
        );
        document.getElementById('feedback-text').setAttribute(
          'value',
          'Ottimo lavoro di Geografia Economica!'
        );
        document.getElementById('feedback-text').setAttribute('color', '#A5D6A7');
        document.getElementById('options-group').setAttribute('visible', 'false');
        document.getElementById('next-btn-text').setAttribute('value', 'RICOMINCIA');
        document.getElementById('next-btn').setAttribute('visible', 'true');
      }

      window.AppVR = {
        handleAction: function (action, value) {
          if (!started) {
            started = true;
            index = 0;
            score = 0;
            renderQuestion();
            return;
          }

          if (action === 'answer' && !answered) {
            answered = true;
            const current = questions[index];
            const fb = document.getElementById('feedback-text');
            if (value === current.correct) {
              score++;
              fb.setAttribute('value', current.ok);
              fb.setAttribute('color', '#A5D6A7');
            } else {
              fb.setAttribute('value', current.ko);
              fb.setAttribute('color', '#FFCC80');
            }
            document.getElementById('next-btn-text').setAttribute(
              'value',
              index < questions.length - 1 ? 'PROSSIMA TAPPA' : 'RISULTATO FINALE'
            );
            document.getElementById('next-btn').setAttribute('visible', 'true');
          } else if (action === 'next') {
            if (index < questions.length - 1) {
              index++;
              renderQuestion();
            } else if (document.getElementById('next-btn-text').getAttribute('value') === 'RICOMINCIA') {
              index = 0;
              score = 0;
              renderQuestion();
            } else {
              renderSummary();
            }
          }
        }
      };
    })();
  </script>
</body>
</html>
